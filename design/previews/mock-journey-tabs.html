<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hành trình điểm: Từng Part và Các đề</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_soc.css">
<style>
:root{--g:#46b35a;--gd:#2f8a42;--gl:#e7f6ea;--gold:#ffc83d;--goldd:#d99a00;--ink:#2f3a33;--mut:#7a857e;--line:#e6e9e6;--blue:#1c8fe3;--pink:#ff7a9c;--vio:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);background:#bfc4cc;display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px}
.page{width:1440px;height:900px;background:#fff;display:grid;grid-template-columns:268px 1fr;overflow:hidden}
.side{border-right:2px solid var(--line);padding:26px 16px}
.logo{font-weight:900;font-size:26px;color:var(--g);letter-spacing:-.8px;padding:0 14px 26px}
.nv{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:14px;font-weight:800;font-size:15.5px;color:#5c675f;border:2px solid transparent;margin-bottom:6px}
.nv.on{background:var(--gl);border-color:#a9dfb3;color:var(--gd)}
.nv i{width:34px;height:34px;border-radius:10px;flex:none}
.btn{display:inline-block;text-align:center;font-weight:900;font-size:15.5px;border-radius:14px;padding:12px 20px}
.btn.g{background:var(--g);color:#fff;box-shadow:0 5px 0 var(--gd)}
.grp{font-weight:800;font-size:13px;color:var(--mut);padding:24px 14px 6px}
.tool{font-weight:800;font-size:14.5px;color:#5c675f;padding:8px 14px}
main{padding:32px 54px 30px}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-weight:900;font-size:30px;letter-spacing:-.8px}
.tabs{display:flex;background:#f1f3f1;border-radius:16px;padding:5px;gap:4px}
.tabs span{font-weight:900;font-size:15px;padding:9px 18px;border-radius:12px;color:#5c675f}
.tabs span.on{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.tabs em{font-style:normal;font-weight:800;color:var(--mut);margin-left:6px}
.hl{display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px}
.hl small{font-weight:900;font-size:14px;color:#c23c63}
.hl h2{font-weight:900;font-size:28px;letter-spacing:-.6px;line-height:1.2;margin-top:2px}
.dd{display:flex;align-items:center;gap:6px;font-weight:900;font-size:14.5px;border:2px solid var(--line);border-radius:14px;padding:8px 14px;box-shadow:0 3px 0 var(--line)}
.dd i{font-style:normal;color:var(--mut)}
svg text{font-family:'Nunito'}
.scene{position:relative;margin-top:16px;height:640px;border-radius:30px;overflow:hidden;background:linear-gradient(#dff1ff,#f3faff 75%)}
.scene>svg{position:absolute;inset:0;width:100%;height:100%}
.sq{position:absolute;left:40px;top:544px;width:80px}.sq svg{display:block;width:100%}
.bub{position:absolute;left:130px;top:562px;background:#fff;border-radius:18px 18px 18px 6px;padding:10px 16px;font-weight:700;font-size:14.5px;width:max-content;max-width:780px;box-shadow:0 4px 0 rgba(47,58,51,.06)}
.bub b{font-weight:900}
.bub .act{display:inline-block;margin-left:12px;font-weight:900;font-size:13.5px;color:#fff;background:var(--g);border-radius:10px;padding:5px 12px;box-shadow:0 3px 0 var(--gd)}
.tip{position:absolute;width:270px;background:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 10px 30px rgba(47,58,51,.14);font-weight:700;font-size:14.5px;color:#4d5850}
.tip>b{font-weight:900;font-size:15px;color:var(--ink)}
.tip .big{font-weight:900;font-size:36px;letter-spacing:-1px;color:#1269ad;margin:2px 0 6px}.tip .big span{font-size:15px;letter-spacing:0;color:var(--mut)}
.tip .row{margin-top:3px}.tip .row b{color:var(--ink)}
.act2{display:inline-block;margin-top:12px;font-weight:900;font-size:14px;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:7px 14px;box-shadow:0 3px 0 var(--line)}
/* drawer */
.dim{position:absolute;inset:0;background:rgba(47,58,51,.32)}
.drw{position:absolute;right:0;top:0;bottom:0;width:560px;background:#fff;padding:30px 34px;overflow:hidden}
.drw .x{position:absolute;right:26px;top:24px;font-weight:900;font-size:15px;color:#5c675f;border:2px solid var(--line);border-radius:12px;padding:6px 12px}
.drw small{font-weight:800;font-size:14px;color:var(--mut)}
.drw h3{font-weight:900;font-size:24px;letter-spacing:-.4px;margin-top:2px}
.drw .score{display:flex;align-items:flex-end;gap:22px;margin-top:16px}
.drw .score .n{font-weight:900;font-size:64px;letter-spacing:-2px;line-height:.9}
.drw .lrr{display:flex;gap:18px;font-weight:800;font-size:15px;color:#5c675f;padding-bottom:6px}
.drw .lrr b{display:block;font-weight:900;font-size:22px;color:var(--ink)}
.drw .lrr em{font-style:normal;font-weight:900;font-size:13px;color:var(--gd);margin-left:4px}
.drw h4{font-weight:900;font-size:15.5px;margin:24px 0 10px}
.mini{display:flex;gap:10px;align-items:flex-end;height:120px;background:#f6f8f6;border-radius:18px;padding:12px 16px 30px;position:relative}
.mini div{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.mini i{display:block;width:100%;border-radius:8px 8px 3px 3px}
.mini b{font-weight:900;font-size:14px;margin-bottom:3px}
.mini span{position:absolute;bottom:-22px;font-weight:800;font-size:12.5px;color:var(--mut)}
.qs{display:flex;flex-wrap:wrap;gap:6px}
.qs span{font-weight:800;font-size:13px;min-width:38px;text-align:center;border-radius:9px;padding:4px 6px;background:#f1f3f1;color:#4d5850}
.qs span.nb{background:#fff0f4;color:#d6416a}
.qs .lbl{background:none;min-width:0;padding:4px 4px 4px 0;font-weight:900;color:var(--ink)}
.drw .foot{position:absolute;left:34px;right:34px;bottom:26px;display:flex;justify-content:space-between;align-items:center}
.drw .foot .btn{font-size:14.5px;padding:10px 16px}
.btn.wh{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.del{font-weight:900;font-size:14.5px;color:#c23c63}
.drw2{position:absolute;right:0;top:0;bottom:0;width:580px;background:#fff;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.card2{border-radius:26px;padding:18px 22px 20px;background:linear-gradient(135deg,#ffe58f,#ffc83d);color:#3d3000}
.ctop{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:14.5px}
.ctop em{font-style:normal;font-size:12.5px;background:#fff;color:#6a4fd0;border-radius:99px;padding:2px 9px;margin-left:6px}
.x2{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.6);display:grid;place-items:center;font-size:18px}
.cmain{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.big2{font-weight:900;font-size:86px;letter-spacing:-3px;line-height:1;color:#2f3a33}
.big2 sup{font-size:20px;letter-spacing:0;vertical-align:42px;margin-left:6px;background:#fff;color:#2f8a42;border-radius:99px;padding:2px 10px}
.chips2{display:flex;gap:8px;align-items:center;margin-top:8px}
.lv{font-weight:900;font-size:14px;background:#2f3a33;color:#ffe58f;border-radius:10px;padding:3px 10px}
.lvn{font-weight:800;font-size:13.5px;color:#5a4a10}
.rec{font-weight:900;font-size:13px;background:#fff;color:#a87a00;border-radius:99px;padding:3px 10px}
.ring2{position:relative;width:132px;height:132px;flex:none}.ring2 svg{width:100%;height:100%}
.ring2>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring2 b{font-weight:900;font-size:28px;letter-spacing:-.5px;color:#2f3a33;line-height:1}.ring2 span{font-weight:800;font-size:12.5px;color:#5a4a10}
.badge2{font-weight:900;font-size:13.5px;background:#2f3a33;color:#ffe58f;border-radius:99px;padding:7px 14px;transform:rotate(-4deg)}
.lr2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px}
.lr2 span{font-weight:800;font-size:13.5px;opacity:.75}.lr2 b{font-weight:900;font-size:22px;margin-left:8px;color:#2f3a33}
.bar2{height:10px;border-radius:99px;background:rgba(255,255,255,.65);margin-top:6px;overflow:hidden}.bar2 i{display:block;height:100%;border-radius:99px}
.say2{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:#f6f8f6;border-radius:18px;padding:8px 16px 8px 10px}
.say2 .s svg{display:block;width:100%}
.say2 p{font-weight:700;font-size:14.5px;line-height:1.45;color:#3f4a43}.say2 b{font-weight:900;color:var(--ink)}
.h5{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.h5 b{font-weight:900;font-size:17px}.h5 span{font-weight:700;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
.h5 .lg{width:14px;height:14px;border-radius:5px;background:#ff7a9c;display:inline-block}
.pr2{display:grid;grid-template-columns:66px 1fr 56px;gap:10px;align-items:start;padding:7px 0;border-top:2px solid #f1f3f1}
.pl{font-weight:900;font-size:15px;padding-top:5px}.pc2{font-weight:900;font-size:13.5px;color:var(--mut);text-align:right;padding-top:6px}
.pq{display:flex;flex-wrap:wrap;gap:6px}
.pq i{font-style:normal;font-weight:800;font-size:14.5px;min-width:42px;text-align:center;border-radius:10px;padding:5px 6px;background:#f3f5f3;color:#4d5850}
.pq i.nb{background:#ff7a9c;color:#fff}
.sec2{flex:1;min-height:0;overflow-y:auto;margin-top:-6px;padding-right:4px;-webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent)}
.pq i.more{background:#fff;border:2px dashed #cfd5cf;color:#5c675f;font-weight:900}
.foot2{margin-top:auto;padding-top:12px;border-top:2px solid #f1f3f1;display:flex;justify-content:space-between;align-items:center}
.foot2 .btn{font-size:15px;padding:12px 18px}
.lnk{display:flex;gap:16px;font-weight:900;font-size:14px;color:#5c675f}
.dtop2{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:16px}
.x3{width:34px;height:34px;border-radius:11px;border:2px solid var(--line);display:grid;place-items:center;font-size:18px;color:#5c675f}
.tk{display:grid;grid-template-columns:1fr 112px;height:206px;filter:drop-shadow(0 8px 16px rgba(47,58,51,.12));flex:none}
.tkm{border-radius:20px 0 0 20px;background:#fff;overflow:hidden;display:flex;flex-direction:column;-webkit-mask:radial-gradient(circle 12px at 100% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 12px at 100% 100%,#0000 98%,#000) bottom/100% 51% no-repeat;mask:radial-gradient(circle 12px at 100% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 12px at 100% 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.tks{border-radius:0 20px 20px 0;background:#fff;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;-webkit-mask:radial-gradient(circle 12px at 0 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 12px at 0 100%,#0000 98%,#000) bottom/100% 51% no-repeat;mask:radial-gradient(circle 12px at 0 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 12px at 0 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.tks::before{content:"";position:absolute;left:0;top:14px;bottom:14px;border-left:2.5px dashed #dfe4df}
.tksky{height:108px;background:linear-gradient(#bfe6ff,#eaf7ff)}.tksky svg{display:block;width:100%;height:100%}
.tklow{flex:1;display:flex;align-items:center;padding:0 22px;gap:16px}
.tkbig{font-weight:900;font-size:54px;letter-spacing:-2px;line-height:1}
.tkvr{width:2px;height:48px;background:#eef0ee}
.tklr{display:flex;gap:18px}.tklr div{font-weight:800;font-size:11.5px;color:var(--mut)}.tklr b{display:block;font-weight:900;font-size:20px;color:var(--ink)}
.tkd{font-weight:900;font-size:34px;letter-spacing:-1px;line-height:1}
.tktag{font-weight:900;font-size:11.5px;border-radius:99px;padding:3px 11px}
.tkre{font-weight:900;font-size:11px;color:#6a4fd0;background:#efeaff;border-radius:99px;padding:2px 9px}
.tkdt{font-weight:800;font-size:11.5px;color:var(--mut);text-align:center;line-height:1.35}
/* tests */
.hl2 h2{font-weight:900;font-size:28px;letter-spacing:-.6px;margin-top:22px}
.tl{margin-top:20px;position:relative}
.tl::before{content:"";position:absolute;left:99px;top:34px;bottom:34px;width:6px;border-radius:3px;background:#ffe08a}
.t{display:grid;grid-template-columns:70px 64px 1fr;align-items:center;margin-bottom:12px;position:relative}
.t .dt{font-weight:800;font-size:14px;color:var(--mut);text-align:right}
.t .dot{justify-self:center;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid var(--goldd);position:relative;z-index:1}
.t.now .dot{width:28px;height:28px;background:var(--g);border-color:#fff;box-shadow:0 0 0 3px #cdeed2}
.t .c{display:grid;grid-template-columns:150px 1fr 200px 16px;align-items:center;gap:18px;background:#f6f8f6;border-radius:20px;padding:13px 22px}
.t.now .c{background:var(--gl)}
.sc{font-weight:900;font-size:32px;letter-spacing:-1px;line-height:1}
.dl{display:inline-block;font-weight:900;font-size:13px;border-radius:99px;padding:2px 9px;margin-left:8px;vertical-align:7px;background:#fff;color:var(--gd)}
.dl.dn{color:#c23c63}
.nm{font-weight:900;font-size:16.5px}
.tg{display:inline-block;font-weight:900;font-size:12.5px;border-radius:99px;padding:2px 10px;margin-left:8px;vertical-align:1px}
.tg.best{background:#fff3d1;color:#a87a00}.tg.re{background:#efeaff;color:#6a4fd0}
.lr{font-weight:800;font-size:14.5px;color:#5c675f}
</style>
</head>
<body>
<div id="out"></div>
<script src="_soc.js"></script>
<script>
const SIDE=`<div class="logo">toeic progress</div>
 <div class="nv"><i style="background:var(--g)"></i>Hôm nay</div>
 <div class="nv on"><i style="background:var(--gold)"></i>Hành trình điểm</div>
 <div class="nv"><i style="background:var(--vio)"></i>Luyện tập</div>
 <div class="nv"><i style="background:var(--pink)"></i>Sổ tay</div>
 <div class="nv"><i style="background:var(--blue)"></i>Thành tích</div>
 <div class="btn g" style="margin:16px 4px 0;display:block">+ Ghi điểm</div>
 <div class="grp">Công cụ</div><div class="tool">Quy đổi điểm</div><div class="tool">Tài liệu</div>`;
const head=(on,n)=>`<div class="top"><h1>Hành trình điểm</h1><div class="tabs"><span class="${on===0?'on':''}">Điểm số</span><span class="${on===1?'on':''}">Từng Part</span><span class="${on===2?'on':''}">Các đề<em>${n}</em></span></div></div>`;

// ---- Từng Part
function parts(hov=-1){
 const now=[1,3,9,6,6,5,16],prev=[1,4,10,7,7,5,19],xs=[130,250,370,490,660,780,900],W=74,B=430,K=17;
 const worst=now.indexOf(Math.max(...now));
 let g=`<path d="M0 545 Q200 520 420 540 T820 530 T1064 520 V640 H0Z" fill="#cdeed2"/><path d="M0 598 Q260 576 540 594 T1064 588 V640 H0Z" fill="#b6e3be"/>`;
 g+=`<line x1="90" y1="${B}" x2="1010" y2="${B}" stroke="#c9d6cc" stroke-width="2"/>`;
 now.forEach((v,i)=>{const x=xs[i],h=Math.max(v*K,22),c=i===worst?'#ff7a9c':i<4?'#1c8fe3':'#46b35a',d=v-prev[i];
  const r=Math.min(16,h-2),L=x-W/2,R=x+W/2,tp=B-h,op=hov>=0&&hov!==i?.3:1;
  g+=`<g opacity="${op}"><path d="M${L} ${B} V${tp+r} Q${L} ${tp} ${L+r} ${tp} H${R-r} Q${R} ${tp} ${R} ${tp+r} V${B}Z" fill="${c}"/>`;
  g+=`</g><text opacity="${op}" x="${x}" y="${B-h-14}" font-weight="900" font-size="${i===worst?34:26}" fill="${i===worst?'#d9547a':'#2f3a33'}" text-anchor="middle">${v}</text>`;
  g+=`<text x="${x}" y="${B+26}" font-weight="900" font-size="15" fill="#2f3a33" text-anchor="middle">Part ${i+1}</text>`;
  if(d)g+=`<rect x="${x-22}" y="${B+36}" width="44" height="22" rx="11" fill="#fff"/><text x="${x}" y="${B+52}" font-weight="900" font-size="13" fill="${d<0?'#2f8a42':'#c23c63'}" text-anchor="middle">${d>0?'+':'−'}${Math.abs(d)}</text>`;
 });
 const br=(a,b,t,c)=>`<path d="M${xs[a]-W/2} ${B+68} V${B+74} H${xs[b]+W/2} V${B+68}" fill="none" stroke="${c}" stroke-width="2" opacity=".5"/><text x="${(xs[a]+xs[b])/2}" y="${B+94}" font-weight="900" font-size="14" fill="${c}" text-anchor="middle">${t}</text>`;
 g+=br(0,3,'Nghe','#1269ad')+br(4,6,'Đọc','#2f8a42');
 return `<div class="page" id="t1"><aside class="side">${SIDE}</aside><main>${head(1,7)}
 <div class="hl"><div><small>Mất điểm ở đâu?</small><h2>Part 7 sai nhiều nhất: 16 trong 46 câu sai</h2></div><span class="dd">Đề 11/11 <i>▾</i></span></div>
 <div class="scene"><svg viewBox="0 0 1064 640">${g}</svg><span class="sq" data-s="idle"></span>
 ${hov===2?`<div class="tip" style="left:${xs[2]+50}px;top:150px"><b>Part 3 · Hội thoại</b><div class="big">9<span> / 39 câu sai</span></div><div class="row">Đề trước: <b>10</b></div><div class="row">4 đề gần đây: 13 → 11 → 10 → <b>9</b></div><span class="act2">Xem 9 câu sai</span></div>`:''}<div class="bub">10 câu cuối Part 7 bạn sai ở cả 4 đề gần đây, nhiều khả năng do <b>hết giờ</b>.<span class="act">Bấm giờ Part 7</span></div></div></main></div>`}

// ---- Các đề
function tests(){
 const T=[['11/11','ETS 2024 Test 03',765,390,375,'re'],['09/11','ETS 2024 Test 06',740,380,360],['09/11','ETS 2024 Test 05',710,360,350],['06/11','ETS 2024 Test 04',725,365,360],['30/10','ETS 2024 Test 03',690,350,340],['22/10','ETS 2024 Test 02',665,330,335],['12/10','ETS 2024 Test 01',620,310,310]];
 const best=Math.max(...T.map(t=>t[2]));
 const rows=T.map((t,i)=>{const p=T[i+1],d=p?t[2]-p[2]:0;
  return `<div class="t ${i?'':'now'}"><span class="dt">${t[0]}</span><span class="dot"></span><div class="c">
   <div><span class="sc">${t[2]}</span>${d?`<span class="dl ${d<0?'dn':''}">${d>0?'+':'−'}${Math.abs(d)}</span>`:''}</div>
   <div class="nm">${t[1]}${t[5]?'<span class="tg re">làm lại</span>':''}${t[2]===best?'<span class="tg best">cao nhất</span>':''}</div>
   <div class="lr">Nghe ${t[3]} · Đọc ${t[4]}</div>
   <svg width="12" height="20" viewBox="0 0 12 20"><path d="M2 2 L10 10 L2 18" fill="none" stroke="#a3aba5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>`}).join('');
 return `<div class="page" id="t2"><aside class="side">${SIDE}</aside><main>${head(2,7)}
 <div class="hl2"><h2>7 đề đã ghi, từ 620 lên 765</h2></div><div class="tl">${rows}</div></main></div>`}


function tk(o){
 const W=420,GOALv=800,x0=30,x1=W-80,yb=92,ya=34,k=o.kind;
 const arc=t=>[x0+(x1-x0)*t, t>1?ya:yb-(yb-ya)*Math.sin(t*Math.PI/2)];
 const path=(a,b)=>{let s='';for(let i=0;i<=48;i++){const [x,y]=arc(a+(b-a)*i/48);s+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}return s};
 const p=Math.max(0,Math.min(1,(o.sc-o.first)/(GOALv-o.first)));
 const pg=k==='goal'?1.2:Math.max(p,.36);
 const [gx,gy]=arc(pg),[tx,ty]=arc(pg+.01),ang=Math.atan2(ty-gy,tx-gx)*180/Math.PI;
 const ban={rec:'Kỷ lục mới!',down:'Lần sau nha!',first:'Cất cánh!',goal:'Chạm 800 rồi!',up:'Tiếp tục bay!'}[k],bw=ban.length*7.1+22,dn=k==='down';

 return `<div class="page" id="${o.id||'t4'}" style="position:relative"><aside class="side">${SIDE}</aside><main>${head(2,7)}

 </div></div>`}
