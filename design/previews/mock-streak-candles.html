<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>Nến chuỗi ngày</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:#2f3a33;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#fff3d1,#ffe0ec);padding:24px}
.wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.card{width:368px;background:#fff;border-radius:24px;padding:16px 18px 14px;box-shadow:0 8px 0 rgba(47,58,51,.06),0 20px 40px rgba(180,120,60,.12);position:relative;overflow:hidden}
.t b{display:block;font-weight:900;font-size:17px;color:#d6416a}.t small{font-weight:700;font-size:12.5px;color:#7a857e}
svg{display:block;width:100%;overflow:visible}
.foot{display:flex;justify-content:space-between;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-weight:900;font-size:12px}
.ctl{display:flex;gap:10px}
.ctl button{border:0;border-radius:14px;padding:10px 16px;font:900 14px Nunito;cursor:pointer;background:#ff8a3d;color:#fff;box-shadow:0 4px 0 #d9661f}
.ctl button.w{background:#fff;color:#2f3a33;box-shadow:0 0 0 2px #e6e9e6,0 4px 0 #e6e9e6}
.note{font-weight:700;font-size:13px;color:#5e6962;max-width:420px;text-align:center}

/* flame */
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:sway 1.6s ease-in-out infinite alternate, stretch .9s ease-in-out infinite alternate}
.core{transform-box:fill-box;transform-origin:50% 100%;animation:core 1.1s ease-in-out infinite alternate}
.halo{transform-box:fill-box;transform-origin:50% 50%;animation:halo 1.4s ease-in-out infinite alternate}
@keyframes sway{0%{rotate:-5deg}50%{rotate:3deg}100%{rotate:-2deg}}
@keyframes stretch{0%{scale:1 1}100%{scale:.92 1.1}}
@keyframes core{0%{opacity:.75;scale:1 .9}100%{opacity:1;scale:1 1.08}}
@keyframes halo{0%{opacity:.35;scale:.9}100%{opacity:.6;scale:1.08}}
.lighting .lit{animation:ignite .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes ignite{0%{scale:.1;opacity:0}60%{scale:1.25;opacity:1}100%{scale:1}}
.lit{transform-box:fill-box;transform-origin:50% 100%}
.smoke{fill:none;stroke:#c9c3cf;stroke-width:2.5;stroke-linecap:round;opacity:0;animation:smoke 1.6s ease-out forwards}
@keyframes smoke{0%{opacity:.8;translate:0 0}100%{opacity:0;translate:4px -26px}}
.match{animation:match 1s ease-in-out forwards}
@keyframes match{0%{translate:-40px 10px;opacity:0}30%{opacity:1}60%{translate:0 0}100%{translate:30px -10px;opacity:0}}
.blow .flame,.blow .core{animation:blowout .6s ease-in forwards}.blow .halo{animation:none;opacity:0;transition:opacity .4s}
@keyframes blowout{0%{rotate:0;scale:1}60%{rotate:40deg;scale:.6 .4}100%{rotate:60deg;scale:0;opacity:0}}
.cf{position:absolute;width:8px;height:12px;border-radius:2px;top:40%;animation:cf 1.6s ease-out forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
.badge{position:absolute;left:50%;top:44%;translate:-50% -50%;background:#ffc83d;color:#6b4a00;border-radius:16px;padding:10px 16px;font-weight:900;font-size:16px;box-shadow:0 5px 0 #d99a00;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;white-space:nowrap}
@keyframes pop{from{scale:.3;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="wrap">
 <div class="card" id="card">
  <div class="t"><b id="title"></b><small id="sub"></small></div>
  <svg viewBox="0 0 330 150" id="cake"></svg>
  <div class="foot"><span class="pill" style="background:#fff1f5;color:#d6416a">Kỷ lục 5 ngày</span><span class="pill" style="background:#eaf5ff;color:#136fb3">❄ 2 ngày nghỉ</span></div>
 </div>
 <div class="ctl"><button id="light">🔥 Thắp nến hôm nay</button><button class="w" id="reset">Về 5 nến</button></div>
 <p class="note">Lửa lay và co giãn liên tục, mỗi nến lệch nhịp. Bấm "Thắp nến hôm nay" để xem nến mới bùng lên; tới nến thứ 7 thì cả 7 nến bị thổi tắt, confetti và huy hiệu hiện ra.</p>
</div>
<script>
const COL=['#ff7a9c','#ffc83d','#7ec8ff','#7fd18c','#a78bfa','#ff9a4d','#ff7a9c'];
let n=5;
function draw(newIdx=-1){
 const cake=document.getElementById('cake');
 let s='<defs><radialGradient id="hg"><stop offset="0" stop-color="#ffd38a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd38a" stop-opacity="0"/></radialGradient></defs>';
 for(let i=0;i<7;i++){const x=34+i*44,on=i<n,d=(i*.23).toFixed(2);
  s+=`<g transform="translate(${x} 0)"><rect x="-6" y="34" width="12" height="38" rx="4" fill="${on?COL[i]:'#efe7ee'}"/><rect x="-6" y="34" width="4" height="38" rx="2" fill="#fff" opacity=".35"/><path d="M0 34 V28" stroke="#5a4a3a" stroke-width="2"/>`;
  if(on){s+=`<g class="lit ${i===newIdx?'new':''}" ${i===newIdx?'style="animation:ignite .7s cubic-bezier(.3,1.6,.5,1) both .45s"':''}><circle class="halo" cx="0" cy="18" r="16" fill="url(#hg)" style="animation-delay:-${d}s"/><path class="flame" style="animation-delay:-${d}s,-${(d*1.7).toFixed(2)}s" d="M0 4 C6 13 8 19 0 30 C-8 19 -6 13 0 4Z" fill="#ff9a2e"/><path class="core" style="animation-delay:-${d}s" d="M0 14 C3 19 4 23 0 28 C-4 23 -3 19 0 14Z" fill="#ffe58f"/></g>`}
  if(i===newIdx)s+=`<g class="match"><rect x="-26" y="10" width="22" height="4" rx="2" fill="#c98b4e" transform="rotate(-20 -15 12)"/><circle cx="-5" cy="7" r="4" fill="#ff7a3d"/></g><path class="smoke" style="animation-delay:1.1s" d="M0 2 q-4 -6 0 -12 q4 -6 0 -12"/>`;
  s+=`</g>`}
 s+='<rect x="8" y="70" width="314" height="40" rx="12" fill="#ffd1dc"/><path d="M8 80 '+[...Array(10)].map((_,k)=>`Q${8+31.4*k+15.7} 100 ${8+31.4*(k+1)} 80`).join(' ')+'" fill="#fff"/><rect x="-4" y="108" width="338" height="12" rx="6" fill="#e6e0f5"/>';
 for(let i=0;i<7;i++)s+=`<text x="${34+i*44}" y="140" text-anchor="middle" font-weight="900" font-size="11" fill="${i===n-1?'#e8730c':'#a3aba5'}">${i===n-1?'Nay':'Ngày '+(i+1)}</text>`;
 cake.innerHTML=s;
 document.getElementById('title').textContent=`Bánh chuỗi · ${n} nến đã thắp`;
 document.getElementById('sub').textContent=n<7?`Thắp đủ 7 nến là nhận bánh 7 ngày 🎂 · còn ${7-n}`:'Đủ 7 nến rồi!';
}
draw();
document.getElementById('light').onclick=()=>{
 if(n>=7)return; n++; draw(n-1);
 if(n===7)setTimeout(()=>{const card=document.getElementById('card');card.classList.add('blow');
  const cs=['#ff7a9c','#ffc83d','#46b35a','#1c8fe3','#a78bfa'];
  for(let k=0;k<26;k++){const c=document.createElement('i');c.className='cf';c.style.left=(20+k*12)%340+'px';c.style.background=cs[k%5];c.style.setProperty('--x',((k%7)-3)*30+'px');c.style.setProperty('--y',(-60-(k%5)*25)+'px');c.style.animationDelay=(k%6)*.05+'s';card.appendChild(c)}
  setTimeout(()=>{const b=document.createElement('div');b.className='badge';b.textContent='🎂 Huy hiệu Chuỗi 7 ngày!';card.appendChild(b)},600)},2400);
};
document.getElementById('reset').onclick=()=>{n=5;const card=document.getElementById('card');card.classList.remove('blow');card.querySelectorAll('.cf,.badge').forEach(e=>e.remove());draw()};
</script></body></html>
