<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sóc Bay: bốn màu lông</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2f3a33;--mut:#7a857e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);background:#bfc4cc;display:flex;justify-content:center;padding:40px}
#sheet{width:1440px;background:#fff;padding:44px 52px 52px}
h1{font-weight:900;font-size:36px;letter-spacing:-1px}
.lead{font-weight:700;font-size:16.5px;color:var(--mut);margin-top:4px}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:28px}
.c{border-radius:32px;padding:24px 22px 22px}
.c .tag{font-weight:900;font-size:13.5px;opacity:.75}
.c h2{font-weight:900;font-size:25px;letter-spacing:-.5px;margin-top:2px}
.c .art{width:270px;margin:6px auto 0}
.c .art svg{display:block;width:100%;overflow:visible}
.c p{font-weight:700;font-size:14.5px;line-height:1.5;margin-top:8px}
.sw{display:flex;gap:7px;margin-top:14px}
.sw i{width:30px;height:30px;border-radius:10px;display:block}
</style>
</head>
<body>
<div id="sheet">
  <h1>Sóc Bay: bốn màu lông</h1>
  <div class="lead">Cùng một dáng, cùng kính phi công vàng và sao vàng. Chỉ đổi màu lông và màu áo choàng.</div>
  <div class="row" id="row"></div>
</div>
<script>
let uid=0;
function grad(id,l,m,d){return `<radialGradient id="${id}" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="${l}"/><stop offset=".55" stop-color="${m}"/><stop offset="1" stop-color="${d}"/></radialGradient>`}
function eye(x,y,rx,ry,iris){return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#33241a"/><ellipse cx="${x}" cy="${y+ry*.45}" rx="${rx*.72}" ry="${ry*.42}" fill="${iris}" opacity=".75"/><circle cx="${x+rx*.32}" cy="${y-ry*.36}" r="${rx*.42}" fill="#fff"/><circle cx="${x-rx*.4}" cy="${y+ry*.34}" r="${rx*.2}" fill="#fff"/>`}
function star(cx,cy,R,fill){let p='';for(let i=0;i<10;i++){const r=i%2?R*.46:R,a=-Math.PI/2+i*Math.PI/5;p+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1)}return `<path d="${p}Z" fill="${fill}" stroke="${fill}" stroke-width="3" stroke-linejoin="round"/>`}
const BEAN='M150 62 C212 62 238 108 238 160 C238 190 226 206 214 218 C222 250 200 284 150 284 C100 284 78 250 86 218 C74 206 62 190 62 160 C62 108 88 62 150 62Z';
const MASK='M150 132 C124 116 86 124 80 158 C76 186 96 204 112 212 C104 240 118 272 150 272 C182 272 196 240 188 212 C204 204 224 186 220 158 C214 124 176 116 150 132Z';

function C(k){const u='c'+(uid++);return `<svg viewBox="-12 -8 330 324"><defs>${grad(u+'b',k.l,k.m,k.d)}${grad(u+'c',k.c1,k.c2,k.c3)}${grad(u+'l','#e2fff6','#8fe6d0','#4fc9ae')}</defs>
 <ellipse cx="160" cy="300" rx="104" ry="10" fill="#2f3a33" opacity=".1"/>
 <path d="M170 284 C250 298 306 254 302 186 C299 134 262 98 231 109 C208 118 207 147 227 156 C214 182 200 202 190 232Z" fill="${k.tail}"/><path d="M246 258 C276 240 290 204 279 166 C273 146 258 134 245 139" fill="none" stroke="${k.stripe}" stroke-width="13" stroke-linecap="round"/>
 <path d="M72 168 C34 176 24 224 46 258 C72 274 228 274 254 258 C276 224 266 176 228 168Z" fill="${k.cape}"/>
 <path d="M80 182 C52 190 44 222 58 248 C82 260 218 260 242 248 C256 222 248 190 220 182Z" fill="${k.lining}"/>
 <ellipse cx="122" cy="287" rx="23" ry="11" fill="${k.dark}"/><ellipse cx="178" cy="287" rx="23" ry="11" fill="${k.dark}"/>
 <ellipse cx="118" cy="284" rx="11" ry="4.500" fill="${k.l}" opacity=".8"/><ellipse cx="174" cy="284" rx="11" ry="4.500" fill="${k.l}" opacity=".8"/>
 <path d="M80 106 C52 52 84 34 114 80Z" fill="${k.m}"/><path d="M85 96 C69 62 88 52 105 80Z" fill="${k.ear}"/>
 <path d="M220 106 C248 52 216 34 186 80Z" fill="${k.m}"/><path d="M215 96 C231 62 212 52 195 80Z" fill="${k.ear}"/>
 <path d="${BEAN}" fill="url(#${u}b)"/>
 <path d="${MASK}" fill="url(#${u}c)"/>
 <ellipse cx="95" cy="192" rx="15" ry="9.500" fill="${k.blush}" opacity=".6"/><ellipse cx="205" cy="192" rx="15" ry="9.500" fill="${k.blush}" opacity=".6"/>
 ${eye(119,165,15,18,k.iris)}${eye(181,165,15,18,k.iris)}
 <ellipse cx="150" cy="186" rx="7" ry="5" fill="${k.nose}"/>
 <path d="M135 194 Q150 216 165 194Z" fill="#5a2f3a"/><path d="M142 204 Q150 213 158 204 Q150 199 142 204Z" fill="#ff8fa8"/>
 <path d="M90 212 C114 229 186 229 210 212 L212 224 C188 242 112 242 88 224Z" fill="${k.collar}"/>
 ${star(150,236,12,'#ffd766')}
 <ellipse cx="76" cy="206" rx="12" ry="19" transform="rotate(54 76 206)" fill="${k.d}"/><ellipse cx="224" cy="206" rx="12" ry="19" transform="rotate(-54 224 206)" fill="${k.d}"/>
 <path d="M66 120 C96 94 204 94 234 120" fill="none" stroke="${k.strap}" stroke-width="10" stroke-linecap="round"/>
 <rect x="139" y="92" width="22" height="11" rx="5.500" fill="#e0a51a"/>
 <circle cx="119" cy="98" r="26" fill="#ffc83d"/><circle cx="119" cy="98" r="20" fill="#e0a51a"/><circle cx="119" cy="98" r="17" fill="url(#${u}l)"/><path d="M108 92 Q114 83 125 85" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
 <circle cx="181" cy="98" r="26" fill="#ffc83d"/><circle cx="181" cy="98" r="20" fill="#e0a51a"/><circle cx="181" cy="98" r="17" fill="url(#${u}l)"/><path d="M170 92 Q176 83 187 85" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/></svg>`}

const cream={c1:'#fffdf7',c2:'#fff3e0',c3:'#f8e0c2'};
const K=[
 {tag:'Màu 1',name:'Nâu hạt dẻ',bg:'#f9efe4',tc:'#8a5231',note:'Lông nâu ấm như hạt dẻ, áo choàng xanh màu app, lót vàng.',
  l:'#e3b088',m:'#c08253',d:'#9c623a',dark:'#8a5231',tail:'#a86c42',stripe:'#f6dcba',...cream,ear:'#ffb9ab',blush:'#ff9d8e',iris:'#6a4630',nose:'#6b3f25',
  cape:'#35a352',lining:'#ffd766',collar:'#4fc06a',strap:'#5f3a22',sw:['#c08253','#fff3e0','#4fc06a','#ffd766','#8fe6d0']},
 {tag:'Màu 2',name:'Cam caramel',bg:'#fff3e6',tc:'#b0591c',note:'Lông cam tươi như bản Sóc cũ, áo choàng xanh màu app, lót kem.',
  l:'#ffc79a',m:'#ffa468',d:'#f58845',dark:'#ea7a38',tail:'#f58845',stripe:'#fff0d9',...cream,ear:'#ffb9ab',blush:'#ff9d8e',iris:'#6a4630',nose:'#8a5231',
  cape:'#35a352',lining:'#fff0c2',collar:'#4fc06a',strap:'#7a4a2b',sw:['#ffa468','#fff3e0','#4fc06a','#fff0c2','#8fe6d0']},
 {tag:'Màu 3',name:'Xám bạc',bg:'#eef1f6',tc:'#5d6880',note:'Màu của sóc bay ngoài đời, áo choàng tím lót hồng giữ lại nét cũ.',
  l:'#eef0f6',m:'#c6ccd9',d:'#a2aabd',dark:'#8e97ad',tail:'#a2aabd',stripe:'#f4f6fa',c1:'#ffffff',c2:'#fbfbfd',c3:'#e8ebf2',ear:'#ffb5d0',blush:'#ff9ec4',iris:'#5a6a8f',nose:'#6c6f80',
  cape:'#9b84f2',lining:'#ff9ec4',collar:'#ff9ec4',strap:'#474d63',sw:['#c6ccd9','#fbfbfd','#9b84f2','#ff9ec4','#8fe6d0']},
 {tag:'Bản cũ',name:'Tím',bg:'#f1ecff',tc:'#6a4fd0',note:'Bản bạn đang xem, để so sánh.',
  l:'#ddd0ff',m:'#b9a4ff',d:'#9b84f2',dark:'#8a70ea',tail:'#a48cf6',stripe:'#e4daff',c1:'#ffffff',c2:'#fbf7ff',c3:'#eadfff',ear:'#ffb5d0',blush:'#ff9ec4',iris:'#6b4fb8',nose:'#7a4f8f',
  cape:'#8a70ea',lining:'#ff9ec4',collar:'#ff9ec4',strap:'#4a3a86',sw:['#b9a4ff','#fbf7ff','#8a70ea','#ff9ec4','#8fe6d0']}];
document.getElementById('row').innerHTML=K.map(k=>`<div class="c" style="background:${k.bg}"><div class="tag" style="color:${k.tc}">${k.tag}</div><h2>${k.name}</h2><div class="art">${C(k)}</div><p>${k.note}</p><div class="sw">${k.sw.map(s=>`<i style="background:${s}"></i>`).join('')}</div></div>`).join('');
</script>
</body>
</html>
