<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>Quy đổi điểm và sidebar</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_soc.css">
<style>
:root{--g:#46b35a;--gd:#2f8a42;--ink:#2f3a33;--mut:#7a857e;--line:#e6e9e6;--teal:#14b8a6;--tealD:#0d8a7c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);background:#bfc4cc;display:flex;flex-direction:column;align-items:center;gap:22px;padding:30px}
.cap{width:1440px;font-weight:900;font-size:21px}.cap small{display:block;font-weight:700;font-size:14px;color:#3f4a43}
.page{width:1440px;height:900px;background:#fff;display:grid;grid-template-columns:268px 1fr;overflow:hidden}
.side{border-right:2px solid #eef0ee;padding:22px 14px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 20px;font-weight:900;font-size:19px;line-height:1}
.logo .m{width:44px;height:44px;border-radius:14px;background:#fff3e0;display:grid;place-items:center;overflow:hidden;box-shadow:0 3px 0 #f1dcc0}
.logo span{display:block;color:var(--g)}
.nv{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;font-weight:900;font-size:15.5px;color:#4d5850;margin-bottom:4px;border:2px solid transparent}
.nv i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px}
.nv.on{background:#e8fbf7;border-color:#a7ece0;color:var(--tealD)}
.nv em{margin-left:auto;font-style:normal;font-size:12px;font-weight:900;border-radius:99px;padding:2px 8px;background:#ffe3ea;color:#d64570}
.cta{margin:14px 4px 0;background:var(--g);color:#fff;border-radius:16px;padding:13px;text-align:center;font-weight:900;box-shadow:0 5px 0 var(--gd)}
.tools{margin-top:18px;padding:0 8px;font-weight:900;font-size:12px;color:#a3aba5;letter-spacing:.5px}
.me{margin-top:auto;border-radius:20px;background:linear-gradient(135deg,#fff3d1,#ffe0ec);padding:12px;display:flex;align-items:center;gap:10px}
.me .soc-s{width:52px;flex:none}.me b{display:block;font-weight:900;font-size:14.5px}.me small{font-weight:800;font-size:12px;color:#7a857e}
.me .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.7);margin-top:5px;overflow:hidden}.me .bar i{display:block;height:100%;width:64%;background:linear-gradient(90deg,#a78bfa,#1c8fe3);border-radius:99px}
.me .fire{margin-left:auto;align-self:flex-start;background:#fff;border-radius:99px;padding:3px 9px;font-weight:900;font-size:13px;color:#e8730c}
.soc-s svg{display:block;width:100%}
main{position:relative;overflow:hidden;padding:26px 40px}
.hd{display:flex;align-items:center;justify-content:space-between}
.hd h2{font-weight:900;font-size:30px;letter-spacing:-.8px}
.seg{display:flex;background:#f1f3f1;border-radius:16px;padding:4px}.seg span{padding:8px 16px;border-radius:12px;font-weight:900;font-size:14.5px;color:#5e6962}.seg span.on{background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.06)}
.pull{border-radius:14px;padding:8px 14px;font-weight:900;font-size:14px;background:#e8fbf7;color:var(--tealD);box-shadow:inset 0 0 0 2px #a7ece0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}
.box{border-radius:28px;padding:20px 22px;position:relative;overflow:hidden}
.sk{background:#fff;box-shadow:0 0 0 2px #eef0ee,0 8px 0 #eef0ee}
.sk h3{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
.sk h3 i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-style:normal;color:#fff}
.sk h3 small{margin-left:auto;font-weight:900;font-size:22px;border-radius:12px;padding:3px 12px}
.big{display:flex;align-items:center;gap:14px;margin-top:14px}
.step{display:flex;align-items:center;gap:6px;background:#f6f7f6;border-radius:16px;padding:6px}
.step b{width:36px;height:36px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 #e6e9e6}
.step span{min-width:70px;text-align:center;font-weight:900;font-size:30px}
.big p{font-weight:800;font-size:13px;color:var(--mut)}
.sl{position:relative;height:14px;border-radius:99px;background:#eef0ee;margin:18px 0 6px}
.sl i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.sl u{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 4px currentColor,0 3px 6px rgba(0,0,0,.2)}
.ticks{display:flex;justify-content:space-between;font-weight:800;font-size:11.5px;color:#a3aba5}
.res{grid-row:span 2;background:linear-gradient(160deg,#14b8a6,#1c8fe3 70%,#7c5ce0);color:#fff}
.res .rays{position:absolute;left:50%;top:170px;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.08) 0 8deg,transparent 8deg 22deg)}
.res>*:not(.rays){position:relative}
.res small.k{font-weight:900;font-size:13px;opacity:.85;letter-spacing:.4px}
.score{text-align:center;margin-top:6px}.score b{font-weight:900;font-size:92px;letter-spacing:-4px;line-height:1}.score span{font-weight:800;font-size:20px;opacity:.85;margin-left:6px}
.lr{display:flex;justify-content:center;gap:12px;margin-top:6px}.lr span{background:rgba(255,255,255,.18);border-radius:99px;padding:5px 12px;font-weight:900;font-size:14px}
.goal{margin-top:16px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.3);border-radius:18px;padding:10px 14px}
.goal p{display:flex;justify-content:space-between;font-weight:800;font-size:13.5px}.goal .b{height:10px;border-radius:99px;background:rgba(0,0,0,.18);margin-top:8px;overflow:hidden}.goal .b i{display:block;height:100%;width:100%;background:#ffe58f;border-radius:99px}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.stp{background:#fff;color:var(--ink);border-radius:16px;padding:10px 8px;text-align:center;transform:rotate(var(--r));box-shadow:0 4px 0 rgba(0,0,0,.12);position:relative}
.stp small{display:block;font-weight:900;font-size:11px;color:var(--mut);letter-spacing:.4px}.stp b{display:block;font-weight:900;font-size:20px;margin-top:2px}
.stp:after{content:'';position:absolute;inset:4px;border:2px dashed var(--c);border-radius:12px;opacity:.5}
.foot{font-weight:700;font-size:12px;opacity:.85;margin-top:12px;text-align:center}
/* ladder */
.lad{margin-top:18px;background:#fff;border-radius:28px;box-shadow:0 0 0 2px #eef0ee;padding:18px 22px}
.lad h3{font-weight:900;font-size:17px}.lad h3 small{font-weight:700;font-size:12.5px;color:var(--mut);margin-left:8px}
.lv{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px;align-items:end;position:relative}
.lv div{border-radius:16px 16px 6px 6px;padding:10px 8px;text-align:center;color:#fff;font-weight:900}
.lv div b{display:block;font-size:20px}.lv div small{display:block;font-size:11.5px;opacity:.9}
.lv .you{box-shadow:0 0 0 4px #fff,0 0 0 7px #ffc83d}
.an{position:absolute;z-index:20;display:flex;align-items:center;gap:6px;background:#2f3a33;color:#fff;border-radius:12px;padding:5px 10px;font-weight:800;font-size:12.5px;white-space:nowrap}.an b{width:20px;height:20px;border-radius:50%;background:#ff7a9c;display:grid;place-items:center;font-size:12px}
</style></head><body>
<div class="cap">Quy đổi điểm + sidebar mới<small>trang Quy đổi theo giao diện mới (màu ngọc riêng cho Công cụ); kết quả là khối màu lớn với "con dấu" IELTS/VSTEP/TOEFL; bảng đối chiếu thành bậc thang CEFR có "Bạn ở đây"; sidebar: logo có Sóc, thẻ cấp + chuỗi ở đáy thay cho "Học viên"</small></div>
<div class="page" id="P"></div>
<script src="_soc.js"></script>
<script>
const LV=[['A1','120','#a3c4f3'],['A2','225','#7fb3f0'],['B1','550','#5fa0ec'],['B2','785','#1c8fe3'],['C1','945','#7c5ce0'],['C2','—','#5b3fc4']];
document.getElementById('P').innerHTML=`<aside class="side"><div class="logo"><span class="m"><span class="soc-s" style="width:46px;margin-top:8px" data-s="idle"></span></span><div>toeic<span>progress</span></div></div>
<div class="nv"><i style="background:#46b35a">⌂</i>Hôm nay</div><div class="nv"><i style="background:#ffc83d">▲</i>Hành trình điểm</div><div class="nv"><i style="background:#a78bfa">⏱</i>Luyện tập</div><div class="nv"><i style="background:#ff7a9c">▤</i>Sổ tay<em>6</em></div><div class="nv"><i style="background:#1c8fe3">🏆</i>Thành tích</div>
<div class="cta">+ Ghi điểm</div><div class="tools">CÔNG CỤ</div><div class="nv on" style="margin-top:6px"><i style="background:#14b8a6">⇄</i>Quy đổi điểm</div>
<div class="me"><span class="soc-s" data-s="hi"></span><div style="flex:1;min-width:0"><b>Cấp 4 · Thợ săn điểm</b><small>Mục tiêu 900</small><div class="bar"><i></i></div></div><span class="fire">🔥 1</span></div></aside>
<main><div class="hd"><h2>Quy đổi điểm</h2><div style="display:flex;gap:12px;align-items:center"><span class="pull">↻ Lấy từ đề gần nhất · 88 / 100</span></div></div>
<div class="grid">
 <div class="box sk"><h3><i style="background:#1c8fe3">🎧</i>Nghe<small style="background:#e6f1ff;color:#1569ab">405</small></h3>
  <div class="big"><div class="step"><b>−</b><span>88</span><b>+</b></div><p>câu đúng / 100<br>sai 12 câu</p></div>
  <div class="sl" style="color:#1c8fe3"><i style="width:88%;background:linear-gradient(90deg,#9fd0ff,#1c8fe3)"></i><u style="left:88%"></u></div><div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div>
 <div class="box res"><span class="rays"></span><small class="k">TỔNG ĐIỂM DỰ KIẾN</small>
  <div class="score"><b>900</b><span>/ 990</span></div><div class="lr"><span>Nghe 405</span><span>Đọc 495</span></div>
  <div class="goal"><p><span>Mục tiêu 900</span><b>Đã chạm! 🎉</b></p><div class="b"><i></i></div></div>
  <div class="stamps"><div class="stp" style="--r:-3deg;--c:#1c8fe3"><small>CEFR</small><b>B2</b></div><div class="stp" style="--r:2deg;--c:#e0557f"><small>IELTS</small><b>5.5–6.5</b></div><div class="stp" style="--r:-1deg;--c:#2f8a42"><small>VSTEP</small><b>Bậc 4</b></div><div class="stp" style="--r:3deg;--c:#7c5ce0"><small>TOEFL iBT</small><b>4–4.5</b></div></div>
  <p class="foot">Ước tính theo IIBC 2023 · chỉ để tham khảo, không thay chứng chỉ</p>
  <span class="soc-s" style="position:absolute;right:14px;top:62px;width:84px" data-s="cheerC"></span></div>
 <div class="box sk"><h3><i style="background:#14b8a6">📖</i>Đọc<small style="background:#e8fbf7;color:#0d8a7c">495</small></h3>
  <div class="big"><div class="step"><b>−</b><span>100</span><b style="opacity:.4">+</b></div><p>câu đúng / 100<br>không sai câu nào</p></div>
  <div class="sl" style="color:#14b8a6"><i style="width:100%;background:linear-gradient(90deg,#a7ece0,#14b8a6)"></i><u style="left:100%"></u></div><div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div>
</div>
<div class="lad"><h3>Bậc thang CEFR<small>mốc tổng TOEIC tối thiểu · Nghe và Đọc cũng cần đạt ngưỡng riêng</small></h3>
 <div class="lv">${LV.map(([l,s,c],i)=>`<div class="${l==='B2'?'you':''}" style="background:${c};height:${54+i*14}px">${l==='B2'?'<span style="position:absolute;margin-top:-44px;margin-left:-6px;background:#ffc83d;color:#5a3d00;border-radius:99px;padding:2px 10px;font-size:12px">Bạn ở đây</span>':''}<b>${l}</b><small>${s==='—'?'TOEIC không đo':s+'+'}</small></div>`).join('')}</div></div>
${'<span class="an" style="left:620px;top:120px"><b>1</b>kéo thanh, con số chạy</span><span class="an" style="left:900px;top:600px"><b>2</b>con dấu đóng xuống khi đổi bậc</span>'}
</main>`;
document.querySelectorAll('[data-s]').forEach(e=>e.innerHTML=soc(e.dataset.s));
</script></body></html>
