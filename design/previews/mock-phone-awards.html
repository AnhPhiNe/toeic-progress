<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>Thành tích trên điện thoại</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lottie/soc-app.css">
<style>
:root{--ink:#2f3a33;--mut:#7a857e;--green:#46b35a;--greenD:#2f8a42}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);background:#bfc4cc;padding:30px 30px 40px}
.cap{font-weight:900;font-size:21px;margin:0 0 4px}.cap small{display:block;font-weight:700;font-size:14px;color:#3f4a43;max-width:1700px}
.row{display:flex;gap:34px;margin:16px 0 40px;align-items:flex-start}
.fw{display:flex;flex-direction:column;gap:10px;align-items:center}
.fw>b{font-weight:900;font-size:16px}.fw>span{font-weight:700;font-size:13px;color:#3f4a43;width:390px;text-align:center;line-height:1.35}
.ph{width:390px;height:844px;border-radius:44px;background:#fff;position:relative;overflow:hidden;box-shadow:0 0 0 10px #1d2420,0 24px 50px rgba(0,0,0,.3)}
.sb{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-weight:900;font-size:15px;z-index:20}
.sb i{width:70px;height:12px;border-radius:6px;background:currentColor;opacity:.85}
.soc svg{display:block;width:100%}
/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:86px;background:#fff;border-top:2px solid #f0f2f0;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px 0;z-index:30}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:900;font-size:11.5px;color:#9aa39d}
.nav a i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:15px;color:#fff;opacity:.55}
.nav a.on{color:var(--ink)}.nav a.on i{opacity:1;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.nav a.add i{width:54px;height:54px;border-radius:18px;margin-top:-22px;background:var(--green);opacity:1;font-size:30px;box-shadow:0 5px 0 var(--greenD),0 8px 18px rgba(70,179,90,.35)}
.nav a.add{color:var(--greenD)}
.nav .badge{position:absolute;margin:-4px 0 0 26px;background:#ff5c86;color:#fff;font-size:10px;border-radius:99px;padding:0 5px;line-height:15px}
/* top bar */
.top{position:absolute;left:18px;right:18px;top:50px;display:flex;align-items:center;gap:8px;z-index:15}
.chip{border-radius:99px;background:rgba(255,255,255,.9);padding:5px 11px;font-weight:900;font-size:13.5px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.av{margin-left:auto;width:40px;height:40px;border-radius:14px;background:#fff3e0;box-shadow:0 0 0 2px #fff,0 3px 8px rgba(0,0,0,.12);position:relative}
.av>s{position:absolute;inset:0;border-radius:14px;overflow:hidden}.av .soc{position:absolute;width:48px;left:-4px;top:-2px}
.av em{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;background:#7c5ce0;color:#fff;font-style:normal;font-size:9px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
/* scene */
.sky{position:absolute;inset:0;background:radial-gradient(circle at 78% 22%,#fffbe8 0 60px,transparent 61px),linear-gradient(180deg,#fff2cf,#ffe3e3 70%,#ffd9e2)}
.rays{position:absolute;left:50%;top:0;width:900px;height:900px;margin-left:-450px;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,240,190,.55) 0 8deg,transparent 8deg 20deg);mask-image:radial-gradient(circle,#000 25%,transparent 60%)}
.hill{position:absolute;left:-40px;right:-40px;border-radius:50% 50% 0 0;background:#a8dc95}
.st{position:absolute}
.st .f{position:absolute;left:0;right:0;bottom:0;border-radius:3px 3px 0 0}
.st .c{position:absolute;left:0;right:0;height:10px;border-radius:3px;transform:translateY(-6px)}
.st .lb{position:absolute;left:50%;transform:translateX(-50%);font-weight:900;font-size:10.5px;color:#fff;background:rgba(0,0,0,.18);border-radius:99px;padding:1px 5px;white-space:nowrap}
.troph{position:absolute}
h1{font-weight:900;letter-spacing:-.6px;line-height:1.08}
h1 em{font-style:normal;color:#f0a500}
.dots{display:flex;gap:3px;align-items:center;font-weight:900;font-size:11.5px;color:#d99a00}.dots i{width:13px;height:5px;border-radius:9px;background:#ffc83d}.dots i.o{background:#eadcb4}.dots i.g{background:var(--green)}.dots span{margin-left:6px}
/* cards */
.next{border-radius:24px;background:linear-gradient(135deg,#4cc062,#2f9e4a);color:#fff;padding:16px 18px;position:relative;overflow:hidden;box-shadow:0 6px 0 #2a8a40}
.next small{font-weight:900;font-size:11.5px;letter-spacing:.5px;opacity:.85}
.next h3{font-weight:900;font-size:24px;letter-spacing:-.4px;margin-top:2px}
.next p{font-weight:800;font-size:13px;opacity:.9}
.next .btns{display:flex;align-items:center;gap:14px;margin-top:12px}
.btn{border-radius:14px;background:#fff;color:var(--greenD);font-weight:900;font-size:16px;padding:11px 22px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.skip{font-weight:900;font-size:13px;text-decoration:underline;opacity:.9}
.next .soc{position:absolute;right:-8px;bottom:-14px;width:96px}
.rest{display:flex;align-items:center;font-weight:900;font-size:13px;color:#8c968f;padding:0 4px}
.rest a{margin-left:auto;color:#1c8fe3}
.task{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 0 0 2px #f0f2f0;font-weight:900;font-size:15px}
.task u{width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 2.5px #cfd6d1;flex:none}
.task.done u{background:var(--green);box-shadow:none}.task.done{color:#a3aba5;text-decoration:line-through}
.task small{display:block;font-weight:800;font-size:11.5px;color:#a3aba5;text-decoration:none}
/* streak */
.streak{background:#fff;border-radius:22px;box-shadow:0 0 0 2px #f6eef0;padding:12px 14px}
.streak .h{display:flex;align-items:center;gap:8px}
.streak .fl{font-size:26px;line-height:1}.streak b{font-weight:900;font-size:24px;color:#ff7a1a}.streak .h span{font-weight:900;font-size:13.5px;color:#ff7a1a}
.streak .h small{margin-left:auto;font-weight:900;font-size:11.5px;color:#4f8fd6;background:#e6f1ff;border-radius:99px;padding:2px 8px}
.cake{position:relative;height:46px;margin:6px 4px 0}
.cake .tier{position:absolute;left:0;right:0;bottom:0;height:16px;border-radius:8px;background:#ffd1dc;box-shadow:inset 0 5px 0 #fff0f4}
.cake .cd{position:absolute;bottom:16px;width:7px;height:20px;border-radius:3px;background:#f2e9ec}
.cake .cd.l{background:#ff7a9c}.cake .cd.l:after{content:'';position:absolute;left:-2px;top:-11px;width:11px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#ffb020}
.days{display:flex;justify-content:space-between;font-weight:900;font-size:10.5px;color:#a3aba5;margin:3px 4px 0}.days b{font-size:10.5px;color:#ff7a1a}
.goal{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1.5px solid #f3f0f1;font-weight:800;font-size:12.5px;color:#5e6962}
.goal b{font-size:12.5px;color:var(--ink)}.goal i{flex:1;height:6px;border-radius:9px;background:#eef0ee;overflow:hidden}.goal i:before{content:'';display:block;width:20%;height:100%;background:var(--green)}
.goal a{font-weight:900;color:#1c8fe3}
/* sheet */
.sheet{position:absolute;left:0;right:0;background:#fbfaf7;border-radius:28px 28px 0 0;box-shadow:0 -8px 24px rgba(120,70,70,.12);padding:10px 16px 0;z-index:10}
.grab{width:40px;height:5px;border-radius:9px;background:#dcd8cf;margin:0 auto 10px}
/* mini journey card (B) */
.jcard{position:relative;border-radius:24px;overflow:hidden;height:186px;box-shadow:0 0 0 2px #fbe6c4}
.jcard .lab{position:absolute;left:16px;top:12px;z-index:3}
.jcard .lab b{display:block;font-weight:900;font-size:17px}
.more{position:absolute;right:12px;top:12px;z-index:3;border-radius:99px;background:#fff;padding:5px 11px;font-weight:900;font-size:12.5px;color:#d99a00;box-shadow:0 2px 0 rgba(0,0,0,.06)}
/* menus (D, E) */
.dim{position:absolute;inset:0;background:rgba(47,58,51,.45);z-index:25}
.msheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:10px 18px 30px;z-index:40}
.mi{display:flex;align-items:center;gap:14px;padding:11px 4px;font-weight:900;font-size:16px}
.mi i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-style:normal;color:#fff;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.mi small{display:block;font-weight:800;font-size:12.5px;color:var(--mut)}
.mi .ar{margin-left:auto;color:#c3cac5;font-size:20px}
.mi .pill{margin-left:auto;background:#ff5c86;color:#fff;border-radius:99px;padding:1px 8px;font-size:12px}
.lvl{display:flex;align-items:center;gap:12px;border-radius:22px;background:linear-gradient(120deg,#fff3e0,#ffe6ee);padding:12px 14px;margin-bottom:6px}
.lvl .soc{width:58px}
.lvl b{font-weight:900;font-size:16px}.lvl small{display:block;font-weight:800;font-size:12.5px;color:var(--mut)}
.lvl .bar{height:7px;border-radius:9px;background:#fff;margin-top:6px;overflow:hidden}.lvl .bar i{display:block;height:100%;width:70%;background:linear-gradient(90deg,#7c5ce0,#1c8fe3)}
.sep{height:1.5px;background:#f0f2f0;margin:4px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 4px}
.big{border-radius:22px;padding:14px 10px 12px;text-align:center;font-weight:900;font-size:14px;line-height:1.2;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.big i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 8px;border-radius:17px;font-style:normal;font-size:24px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.14)}
.big small{display:block;font-weight:800;font-size:11.5px;color:var(--mut);margin-top:3px}

.hero{position:absolute;left:0;right:0;top:0;height:400px;background:radial-gradient(circle at 70% 40%,#7a63e8,#4b3fb5 70%);overflow:hidden}
.hero:before{content:'';position:absolute;inset:-200px;background:repeating-conic-gradient(from 0deg at 62% 48%,rgba(255,255,255,.07) 0 9deg,transparent 9deg 22deg)}
.hhd{position:absolute;left:18px;right:18px;top:52px;display:flex;align-items:center;color:#fff;z-index:3}
.hhd h2{font-weight:900;font-size:24px;letter-spacing:-.5px}
.lvl2{position:absolute;left:20px;top:104px;color:#fff;z-index:3}
.lvl2 small{font-weight:900;font-size:11.5px;letter-spacing:.6px;opacity:.75}
.lvl2 b{display:block;font-weight:900;font-size:24px;line-height:1.15}.lvl2 b em{font-style:normal;color:#ffd25e}
.ring{position:absolute;left:20px;top:178px;width:132px;height:132px;border-radius:50%;background:conic-gradient(#ffc83d 0 70%,rgba(255,255,255,.18) 70% 100%);display:grid;place-items:center;z-index:3}
.ring:before{content:'';position:absolute;inset:12px;border-radius:50%;background:#5a4cc9}
.ring span{position:relative;font-weight:900;font-size:34px;color:#fff}.ring span i{font-style:normal;color:#ffd25e;font-size:22px}
.ringsub{position:absolute;left:20px;top:320px;width:132px;text-align:center;font-weight:900;font-size:12px;color:#d9d2ff;z-index:3}
.hsoc{position:absolute;right:14px;top:150px;width:170px;z-index:3}
.wear{position:absolute;right:26px;top:338px;z-index:4;display:flex;align-items:center;gap:6px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;font-weight:900;font-size:13px;padding:8px 13px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.body{position:absolute;left:0;right:0;top:380px;bottom:86px;background:#fbfaf7;border-radius:26px 26px 0 0;padding:16px 16px 0;overflow:hidden;z-index:5}
.sh{display:flex;align-items:baseline;gap:8px;font-weight:900;font-size:16px}.sh small{font-weight:800;font-size:12px;color:var(--mut)}.sh a{margin-left:auto;font-size:12.5px;color:#7c5ce0}
.quests{display:flex;gap:10px;margin-top:10px;overflow:hidden;margin-right:-16px}
.qc{flex:none;width:210px;border-radius:20px;background:#fff;box-shadow:0 0 0 2px #efeaff;padding:12px;display:flex;gap:10px;align-items:center}
.qc b{display:block;font-weight:900;font-size:14px}.qc small{display:block;font-weight:800;font-size:11.5px;color:var(--mut);margin-top:1px}
.qc .bar{height:6px;border-radius:9px;background:#f0edf8;margin-top:6px;overflow:hidden}.qc .bar i{display:block;height:100%;background:#ffc83d}
.bd{flex:none;width:52px;height:56px;position:relative;display:grid;place-items:center}
.bd .sh2{position:absolute;inset:0;clip-path:polygon(50% 0,100% 18%,100% 62%,50% 100%,0 62%,0 18%);background:var(--c)}
.bd .sh2:after{content:'';position:absolute;inset:4px;clip-path:polygon(50% 0,100% 18%,100% 62%,50% 100%,0 62%,0 18%);background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0))}
.bd span{position:relative;font-size:22px}
.bd.lock{filter:grayscale(1);opacity:.45}
.bd .lk{position:absolute;right:-4px;top:-4px;width:18px;height:18px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:10px;box-shadow:0 1px 3px rgba(0,0,0,.2);filter:none}
.fams{display:flex;gap:6px;margin-top:16px;overflow:hidden;margin-right:-16px}
.fams span{flex:none;border-radius:99px;padding:6px 11px;font-weight:900;font-size:12.5px;background:var(--b);color:var(--c)}
.fams span.on{box-shadow:inset 0 0 0 2px var(--c)}
.fams span em{font-style:normal;opacity:.65;margin-left:4px}
.grid3b{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin-top:14px}
.cell{text-align:center}.cell .bd{margin:0 auto;width:62px;height:66px}.cell .bd span{font-size:26px}
.cell b{display:block;font-weight:900;font-size:12.5px;margin-top:5px;line-height:1.2}.cell small{display:block;font-weight:800;font-size:11px;color:#a3aba5}
.cell.off b{color:#a3aba5}
.mini{position:absolute;left:0;right:0;top:0;height:120px;background:radial-gradient(circle at 70% 40%,#7a63e8,#4b3fb5 70%)}
.wd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.wi{border-radius:18px;background:#f7f5f0;padding:10px 6px 8px;text-align:center;font-weight:900;font-size:12.5px;position:relative}
.wi .ic{font-size:30px;line-height:1.2}
.wi small{display:block;font-weight:800;font-size:10.5px;color:#a3aba5}
.wi.on{background:#f1ebff;box-shadow:inset 0 0 0 2.5px #7c5ce0;color:#5b3fc4}
.wi.on:after{content:'✓';position:absolute;right:6px;top:6px;width:18px;height:18px;border-radius:50%;background:#7c5ce0;color:#fff;font-size:11px;display:grid;place-items:center}
.wi.lock{opacity:.5}
.send{display:block;border-radius:99px;color:#fff;font-weight:900;font-size:16px;padding:15px 0;text-align:center}
</style></head><body>
<div class="cap">Thành tích trên điện thoại<small>Nửa trên là “thẻ cấp” tím như desktop: cấp, vòng sao, Sóc mặc đồ, nút Đồ cho Sóc. Nửa dưới cuộn: 3 nhiệm vụ sắp mở (vuốt ngang) rồi bộ sưu tập 3 cột theo nhóm. Chạm huy hiệu → bảng chi tiết.</small></div>
<div class="row" id="R1"></div>
<script src="lottie/soc-strings.js"></script>
<script>
const S=k=>`<span class="soc">${SOC[k]}</span>`;
const sv=d=>`<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const icon={home:['#46b35a',sv('<path d="M4 11 12 4l8 7v9h-5v-5H9v5H4z" fill="#fff" stroke="none"/>')],j:['#ffc83d',sv('<path d="M6 19v-4M12 19V10M18 19V5"/>')],p:['#a78bfa',sv('<circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 2M10 3h4"/>')],n:['#ff7a9c',sv('<path d="M5 5h6v14H5zM13 5h6v14h-6z" fill="#fff" stroke="none"/>')]};
const NAV=(on='home')=>`<nav class="nav">${[['home','Hôm nay'],['j','Hành trình'],['add','Ghi'],['p','Luyện tập'],['n','Sổ tay']].map(([k,l])=>k==='add'?`<a class="add"><i>+</i>${l}</a>`:`<a class="${k===on?'on':''}"><i style="background:${icon[k][0]}">${icon[k][1]}</i>${k==='n'?'<span class="badge">8</span>':''}${l}</a>`).join('')}</nav>`;
const SB=(c='#2f3a33')=>`<div class="sb" style="color:${c}"><span>9:41</span><i></i></div>`;
const TOP=`<div class="top"><span class="chip">🔥 6</span><span class="chip" style="color:#7c5ce0">📅 Đặt ngày thi</span><span class="av"><s>${S('idle')}</s><em>4</em></span></div>`;
/* stairs: x0,y0 = bottom-left; w step width, rise per step */
function stairs(x0,base,w,rise,h0,cur=5,n=9,labels=true){
  let o='';const vals=[560,590,620,650,680,710,740,770];
  for(let i=0;i<n-1;i++){const hh=h0+rise*i, x=x0+i*w;
    const done=i<cur, now=i===cur;
    const f=done?'linear-gradient(90deg,#f5b82e 50%,#e39a12 50%)':now?'linear-gradient(90deg,#3fae55 50%,#2a8a40 50%)':'linear-gradient(90deg,#efedf8 50%,#e0dcf1 50%)';
    const c=done?'#ffd25e':now?'#6fd07f':'#f6f4fc';
    o+=`<div class="st" style="left:${x}px;top:${base-hh}px;width:${w}px;height:${hh}px"><div class="f" style="top:0;background:${f}"></div><div class="c" style="background:${c}"></div>${labels?`<span class="lb" style="top:${now?8:10}px;${done||now?'':'color:#9a94bb;background:#fff'}">${vals[i]}</span>`:''}</div>`;}
  return o;}
const TROPHY=(x,y,s=1)=>`<svg class="troph" style="left:${x}px;top:${y}px;width:${90*s}px" viewBox="0 0 90 100"><path d="M18 10 C2 10 2 40 24 44" fill="none" stroke="#f0a500" stroke-width="7"/><path d="M72 10 C88 10 88 40 66 44" fill="none" stroke="#f0a500" stroke-width="7"/><path d="M16 4 H74 C74 40 62 56 45 58 C28 56 16 40 16 4Z" fill="#ffc83d"/><path d="M45 18 l4 9 10 1-7.5 6.5 2.3 10-8.8-5.3-8.8 5.3 2.3-10L31 28l10-1Z" fill="#fff6d0"/><rect x="38" y="58" width="14" height="12" fill="#f0a500"/><rect x="24" y="70" width="42" height="9" rx="3" fill="#ffc83d"/><rect x="18" y="79" width="54" height="17" rx="3" fill="#2f3a33"/><text x="45" y="92" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="12" fill="#ffd25e">800</text></svg>`;
const DOTS=`<div class="dots">${'iiiiigooo'.split('').map(c=>`<i class="${c==='g'?'g':c==='o'?'o':''}"></i>`).join('')}<span>BẬC 6/9 · CÒN 75 ĐIỂM</span></div>`;
const NEXT=(soc=true)=>`<div class="next"><small>TIẾP THEO · 8 PHÚT</small><h3>Ôn 8 câu sai</h3><p>Đến hạn hôm nay</p><div class="btns"><span class="btn">▶ Bắt đầu</span><span class="skip">Bỏ qua hôm nay</span></div>${soc?S('idle'):''}</div>`;
const CANDLES=`<div class="cake"><div class="tier"></div>${[0,1,2,3,4,5,6].map(i=>`<div class="cd ${i===0?'l':''}" style="left:${5+i*14.8}%;margin-left:-3px"></div>`).join('')}</div><div class="days"><b>Nay</b><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div>`;
const STREAK=`<div class="streak"><div class="h"><span class="fl">🔥</span><b>6</b><span>ngày liền · còn 6 nến là xong bánh</span><small>❄ 2</small></div>${CANDLES}<div class="goal">Mục tiêu tuần: <b>1/5</b> buổi<i></i><a>Sửa</a></div></div>`;
