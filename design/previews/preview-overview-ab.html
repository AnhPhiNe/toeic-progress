<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tổng quan A và B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#F6F8F7;--surface:#FFFFFF;--subtle:#EEF1F0;--line:#DFE4E2;--line-strong:#878F8C;
    --ink:#232927;--muted:#5F6966;--action:#387F48;--action-dark:#2B6638;--action-soft:#DCEFD3;--action-ink:#2B6638;
    --sun:#F2B93B;--sun-soft:#FFF3D3;--sun-ink:#6F4F05;--wrong:#C93C4B;--wrong-soft:#FDE3E5;--wrong-ink:#B42F3E;
    --lis:#5B5BD6;--lis-soft:#E7E7FB;--lis-ink:#3A3A9E;--rea:#2E8F7E;--rea-soft:#DDF2EE;--rea-ink:#1F6457;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#E3E8E5;color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px;margin:0 auto;padding:24px 16px 60px}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .head h1{font-family:Nunito,sans-serif;font-weight:900;font-size:26px;margin:0}
  .head p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:720px}
  .switch{position:sticky;top:12px;z-index:5;display:flex;gap:4px;background:#fff;border-radius:999px;padding:4px;box-shadow:0 6px 18px -8px rgba(0,0,0,.3)}
  .switch button{border:0;font:inherit;font-weight:700;font-size:14px;padding:9px 18px;border-radius:999px;cursor:pointer;background:transparent;color:var(--muted)}
  .switch button[aria-pressed="true"]{background:var(--action);color:#fff}
  .note{margin:10px 0 14px;font-size:13.5px;color:var(--muted)}
  .note b{color:var(--ink)}

  /* ===== shared layout ===== */
  .app{display:grid;grid-template-columns:232px 1fr;min-height:880px;background:var(--canvas);border-radius:20px;overflow:hidden;box-shadow:0 30px 70px -40px rgba(0,0,0,.5)}
  .side{background:var(--surface);padding:16px 12px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:10px;margin:0 6px 20px}
  .logo{width:40px;height:40px;display:grid;place-items:center;font-family:Nunito;font-weight:900;color:#fff;background:var(--action)}
  .brand b{font-family:Nunito;font-weight:800;font-size:17px}
  .grp{font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 10px 6px}
  .nav{display:flex;align-items:center;gap:10px;padding:9px 10px;font-size:14px;font-weight:500;margin-bottom:3px}
  .nav i{width:26px;height:26px;display:grid;place-items:center;font-style:normal;font-size:13px}
  .nav .badge{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--wrong-soft);color:var(--wrong-ink)}
  .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px 0}
  .avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--action-soft);color:var(--action-ink)}
  .me small{display:block;color:var(--muted);font-size:12px}
  .main{display:flex;flex-direction:column;min-width:0}
  .top{display:flex;align-items:center;gap:10px;padding:12px 24px;background:var(--surface)}
  .top h2{font-family:Nunito;font-weight:800;font-size:21px;margin:0 auto 0 0}
  .chip{font-size:13px;font-weight:600;padding:8px 12px}
  .cta{font-size:13px;font-weight:700;color:#fff;background:var(--action);padding:8px 14px}
  .body{padding:20px 24px 28px;display:flex;flex-direction:column;gap:16px}
  .tabs{display:flex;gap:6px}
  .tab{font-size:13.5px;font-weight:600;padding:8px 16px}
  .resume{display:flex;align-items:center;gap:14px;padding:14px 18px}
  .resume b{display:block;font-size:15px}
  .resume span{font-size:13px;color:var(--muted)}
  .resume em{margin-left:auto;font-style:normal;font-weight:700;font-size:13.5px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr 1.15fr;gap:16px}
  .kpi{padding:16px 18px}
  .kpi .lab{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
  .pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
  .num{font-family:Nunito;font-weight:900;font-size:46px;line-height:1;letter-spacing:-.02em;margin:14px 0 6px}
  .num small{font-family:"Be Vietnam Pro";font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
  .kpi p{margin:8px 0 0;padding-top:10px;font-size:13px;color:var(--muted)}
  .streak{padding:16px 18px}
  .streak h3{margin:0;font-family:Nunito;font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted)}
  .week i{display:block;height:38px;margin-top:5px;font-style:normal}
  .week .today{color:var(--sun-ink)}
  .row2{display:grid;grid-template-columns:2fr 1.15fr;gap:16px}
  .chart{padding:16px 18px}
  .chart h3,.last h3{margin:0;font-family:Nunito;font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center}
  .seg{display:flex;gap:2px;padding:3px;font-size:12.5px;font-weight:600}
  .seg span{padding:4px 10px}
  svg.line{width:100%;height:260px;margin-top:10px}
  .last{padding:16px 18px}
  .last .meta{font-size:13px;color:var(--muted);margin-top:4px}
  .last .big{font-family:Nunito;font-weight:900;font-size:58px;line-height:1;margin:14px 0 4px}
  .last .big small{font-family:"Be Vietnam Pro";font-size:16px;color:var(--muted);font-weight:600}
  .goal{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-top:12px}
  .goal em{font-style:normal;color:var(--wrong-ink);font-weight:700}
  .track{height:9px;border-radius:99px;background:var(--subtle);margin-top:8px;overflow:hidden}
  .track i{display:block;height:100%;width:87%;background:var(--action);border-radius:99px}
  .lr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .lr div{padding:10px 12px}
  .lr small{display:block;font-size:12.5px;font-weight:700}
  .lr strong{font-family:Nunito;font-weight:900;font-size:28px}
  .lr span{font-size:12px;color:var(--muted)}

  /* ===== A: soft ===== */
  .A .side{border-right:1px solid var(--line)}
  .A .logo{border-radius:12px}
  .A .nav{border-radius:12px}
  .A .nav.on{background:var(--action-soft);color:var(--action-ink);font-weight:700}
  .A .nav.on i{background:var(--action);color:#fff;border-radius:7px}
  .A .top{border-bottom:1px solid var(--line)}
  .A .chip{background:var(--subtle);border-radius:12px}
  .A .cta{border-radius:14px;box-shadow:0 3px 0 var(--action-dark)}
  .A .tab{border-radius:999px;background:var(--subtle);color:var(--muted)}
  .A .tab.on{background:var(--action-soft);color:var(--action-ink)}
  .A .card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
  .A .resume{background:var(--sun-soft);border:0;border-radius:18px}
  .A .resume em{color:var(--sun-ink)}
  .A .kpi p{border-top:1px solid var(--line)}
  .A .week i{background:var(--subtle);border-radius:10px}
  .A .week .today i{background:var(--sun-soft);box-shadow:inset 0 0 0 2px var(--sun)}
  .A .seg{background:var(--subtle);border-radius:10px}
  .A .seg span{border-radius:8px}
  .A .seg .on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .A .lr div{border-radius:14px}
  .A .lr .l{background:var(--lis-soft)} .A .lr .r{background:var(--rea-soft)}

  /* ===== B: neo + Mầm ===== */
  .B .side{border-right:2px solid var(--ink)}
  .B .logo{border-radius:12px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
  .B .nav{border-radius:12px;border:2px solid transparent}
  .B .nav.on{background:var(--action-soft);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:800}
  .B .nav.on i{background:var(--action);color:#fff;border-radius:7px;border:1.5px solid var(--ink)}
  .B .top{border-bottom:2px solid var(--ink)}
  .B .chip{background:var(--sun-soft);border:2px solid var(--ink);border-radius:12px;box-shadow:2px 2px 0 var(--ink)}
  .B .cta{border-radius:12px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
  .B .tab{border-radius:12px;border:2px solid var(--ink);background:#fff}
  .B .tab.on{background:var(--action);color:#fff;box-shadow:2px 2px 0 var(--ink)}
  .B .card{background:var(--surface);border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink)}
  .B .resume{background:var(--sun-soft)}
  .B .kpi p{border-top:2px dashed var(--line)}
  .B .pill{border:1.5px solid var(--ink)}
  .B .week i{background:#fff;border:2px solid var(--line);border-radius:10px}
  .B .week .today i{background:var(--sun-soft);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
  .B .seg{border:2px solid var(--ink);border-radius:10px}
  .B .seg span{border-radius:7px}
  .B .seg .on{background:var(--ink);color:#fff}
  .B .lr div{border:2px solid var(--ink);border-radius:12px;box-shadow:2px 2px 0 var(--ink)}
  .B .lr .l{background:var(--lis-soft)} .B .lr .r{background:var(--rea-soft)}
  .B .num{text-shadow:none}

  /* ===== C: B nhẹ (Neo nhẹ) ===== */
  .C{--neo:#4A5450;--neo-shadow:#C4CCC8}
  .C .side{border-right:1.5px solid var(--neo)}
  .C .logo{border-radius:12px;border:1.5px solid var(--neo)}
  .C .nav{border-radius:12px;border:1.5px solid transparent}
  .C .nav.on{background:var(--action-soft);border-color:var(--neo);box-shadow:2px 2px 0 var(--neo-shadow);font-weight:700;color:var(--action-ink)}
  .C .nav.on i{background:var(--action);color:#fff;border-radius:7px}
  .C .top{border-bottom:1.5px solid var(--neo)}
  .C .chip{background:var(--sun-soft);border:1.5px solid var(--neo);border-radius:12px}
  .C .cta{border-radius:12px;border:1.5px solid var(--action-dark);box-shadow:3px 3px 0 var(--action-dark)}
  .C .tab{border-radius:12px;border:1.5px solid var(--line-strong);background:#fff;color:var(--muted)}
  .C .tab.on{background:var(--action-soft);color:var(--action-ink);border-color:var(--neo)}
  .C .card{background:var(--surface);border:1.5px solid var(--neo);border-radius:16px;box-shadow:3px 3px 0 var(--neo-shadow)}
  .C .resume{background:var(--sun-soft)}
  .C .kpi p{border-top:1px solid var(--line)}
  .C .week i{background:var(--subtle);border-radius:10px}
  .C .week .today i{background:var(--sun-soft);border:1.5px solid var(--sun)}
  .C .seg{background:var(--subtle);border-radius:10px}
  .C .seg span{border-radius:8px}
  .C .seg .on{background:#fff;box-shadow:inset 0 0 0 1.5px var(--neo)}
  .C .lr div{border-radius:12px}
  .C .lr .l{background:var(--lis-soft)} .C .lr .r{background:var(--rea-soft)}
  @media (max-width:1100px){.grid{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>Tổng quan: hướng A và hướng B</h1><p>Cùng dữ liệu, cùng màu Mầm và font Nunito + Be Vietnam Pro (đủ độ đậm 400–900). Chỉ khác cách vẽ viền, bóng và khung.</p></div>
    <div class="switch" role="group" aria-label="Chọn hướng"><button type="button" data-v="A" aria-pressed="true">A · Mềm</button><button type="button" data-v="B" aria-pressed="false">B · Neo + Mầm</button><button type="button" data-v="C" aria-pressed="false">B nhẹ</button><button type="button" data-v="BC" aria-pressed="false">B và B nhẹ</button><button type="button" data-v="AB" aria-pressed="false">A và B</button></div>
  </div>
  <p class="note" id="note"></p>
  <div id="stage"></div>
</div>

<template id="tpl">
  <div class="app">
    <aside class="side">
      <div class="brand"><span class="logo">TP</span><b>TOEIC Progress</b></div>
      <div class="grp">Học</div>
      <div class="nav on"><i>▦</i>Tổng quan</div>
      <div class="nav"><i>▢</i>Sổ tay<span class="badge">3</span></div>
      <div class="nav"><i>▤</i>Từ vựng</div>
      <div class="grp">Luyện đề</div>
      <div class="nav"><i>◷</i>Lịch sử thi</div>
      <div class="nav"><i>◔</i>Đồng hồ phòng thi</div>
      <div class="grp">Tiến bộ</div>
      <div class="nav"><i>↗</i>Phân tích điểm</div>
      <div class="me"><span class="avatar">MT</span><div><b style="font-size:13.5px">Minh Tuấn</b><small>Mục tiêu 990 điểm</small></div></div>
    </aside>
    <div class="main">
      <div class="top"><h2>Tổng quan</h2><span class="chip">Thi: D-18</span><span class="cta">＋ Ghi điểm</span></div>
      <div class="body">
        <div class="tabs"><span class="tab on">Tổng quan</span><span class="tab">Kế hoạch tuần</span></div>
        <div class="resume card"><div><b>Tiếp tục ghi chi tiết đề "hihihi"</b><span>Còn 4 câu Reading chưa ghi nội dung, từ ngày 23/10/2026</span></div><em>Ghi tiếp →</em></div>
        <div class="grid">
          <div class="kpi card"><div class="lab">Kỷ lục<span class="pill" style="background:var(--sun-soft);color:var(--sun-ink)">Thiếu 30 điểm</span></div><div class="num" style="color:#B7850F">960<small>/ 990</small></div><p>ETS 2024 Test 04</p></div>
          <div class="kpi card"><div class="lab">Trung bình<span class="pill" style="background:var(--lis-soft);color:var(--lis-ink)">10 đề</span></div><div class="num" style="color:var(--lis)">909<small>/ 990</small></div><p>Dao động từ 825 đến 960</p></div>
          <div class="kpi card"><div class="lab">So với bài đầu<span class="pill" style="background:var(--action-soft);color:var(--action-ink)">Tăng</span></div><div class="num" style="color:var(--action)">+40<small>điểm</small></div><p>Từ 825 lên 865</p></div>
          <div class="streak card"><h3>Chuỗi ngày học<span class="pill" style="background:var(--sun-soft);color:var(--sun-ink)">0 ngày</span></h3><div style="font-size:13px;color:var(--muted);margin-top:8px">Tuần này học 0 trên 7 ngày</div>
            <div class="week"><div>T2<i></i></div><div>T3<i></i></div><div>T4<i></i></div><div class="today">T5<i></i></div><div>T6<i></i></div><div>T7<i></i></div><div>CN<i></i></div></div></div>
        </div>
        <div class="row2">
          <div class="chart card"><h3>Tiến bộ qua từng bài thi<span class="seg"><span class="on">Tất cả</span><span>Lần đầu</span></span></h3>
            <svg class="line" viewBox="0 0 600 260" preserveAspectRatio="none">
              <line x1="0" x2="600" y1="20" y2="20" stroke="#DFE4E2" stroke-dasharray="5 5"/><text x="4" y="14" font-size="11" fill="#387F48" font-family="Be Vietnam Pro" font-weight="600">Mục tiêu 990</text>
              <polygon fill="#DCEFD3" opacity=".55" points="20,250 80,193 140,129 200,142 260,116 320,78 380,110 440,110 500,110 560,199 560,260 20,260"/>
              <polyline fill="none" stroke="#387F48" stroke-width="3" stroke-linejoin="round" points="20,250 80,193 140,129 200,142 260,116 320,78 380,110 440,110 500,110 560,199"/>
              <g fill="#fff" stroke="#387F48" stroke-width="2.5"><circle cx="80" cy="193" r="4.5"/><circle cx="140" cy="129" r="4.5"/><circle cx="200" cy="142" r="4.5"/><circle cx="260" cy="116" r="4.5"/><circle cx="320" cy="78" r="4.5"/><circle cx="380" cy="110" r="4.5"/><circle cx="440" cy="110" r="4.5"/><circle cx="500" cy="110" r="4.5"/></g>
              <circle cx="560" cy="199" r="6" fill="#387F48"/>
              <g font-size="12" font-family="Be Vietnam Pro" font-weight="700" fill="#232927" text-anchor="middle"><text x="80" y="181">870</text><text x="140" y="117">920</text><text x="200" y="130">910</text><text x="260" y="104">930</text><text x="320" y="66">960</text><text x="380" y="98">935</text><text x="440" y="98">935</text><text x="500" y="98">935</text><text x="560" y="187">865</text></g>
            </svg></div>
          <div class="last card"><h3>Kết quả gần nhất<span class="pill" style="background:var(--lis-soft);color:var(--lis-ink)">Trình độ B2</span></h3>
            <div class="meta">Đề "hihihi", ngày 23/10</div>
            <div class="big">865<small> / 990</small></div>
            <span class="pill" style="background:var(--wrong-soft);color:var(--wrong-ink)">Giảm 70 điểm so với bài trước</span>
            <div class="goal"><span>Mục tiêu 990</span><em>còn 125 điểm</em></div>
            <div class="track"><i></i></div>
            <div class="lr"><div class="l"><small style="color:var(--lis-ink)">Listening</small><strong>405</strong> <span>/ 495 · 90 câu đúng</span></div><div class="r"><small style="color:var(--rea-ink)">Reading</small><strong>460</strong> <span>/ 495 · 96 câu đúng</span></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  const notes = {
    A: '<b>A · Mềm:</b> viền mảnh 1px, không bóng cứng, mục đang chọn tô nền xanh nhạt. Nhẹ mắt, gần Duolingo, Mochi.',
    B: '<b>B · Neo + Mầm:</b> giữ viền đậm 2px và bóng đổ cứng làm chữ ký riêng, đổi sang màu Mầm và font mới. Nổi bật, giữ nhận diện cũ.',
    C: '<b>B nhẹ:</b> giữ khung Neo nhưng viền 1.5px màu xám mềm, bóng cứng chỉ 3px màu nhạt và chỉ ở thẻ lớn, nút chính; chip, tab, ô bên trong không có bóng.',
    BC: '<b>So sánh B và B nhẹ:</b> B bên trái, B nhẹ bên phải, thu nhỏ để vừa màn hình.',
    AB: '<b>So sánh A và B:</b> A bên trái, B bên phải, thu nhỏ để vừa màn hình.'
  };
  const stage = document.getElementById('stage'), tpl = document.getElementById('tpl'), note = document.getElementById('note');
  function show(v) {
    stage.innerHTML = '';
    note.innerHTML = notes[v];
    const versions = v === 'AB' ? ['A', 'B'] : v === 'BC' ? ['B', 'C'] : [v];
    const holder = document.createElement('div');
    if (v === 'AB' || v === 'BC') holder.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:16px;zoom:.5';
    for (const name of versions) {
      const box = document.createElement('div'); box.className = name;
      box.appendChild(tpl.content.cloneNode(true)); holder.appendChild(box);
    }
    stage.appendChild(holder);
    for (const b of document.querySelectorAll('[data-v]')) b.setAttribute('aria-pressed', String(b.dataset.v === v));
  }
  for (const b of document.querySelectorAll('[data-v]')) b.addEventListener('click', () => show(b.dataset.v));
  show('A');
</script>
</body>
</html>
