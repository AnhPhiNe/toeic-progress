<!doctype html><html lang="vi"><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
:root{--ink:#0F172A;--bg:#FBFAF6;--muted:#64748B}
*{box-sizing:border-box;margin:0}
body{font-family:"Plus Jakarta Sans",sans-serif;background:var(--bg);color:var(--ink);width:1180px;padding:22px 28px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 26px;align-items:start}
.tag{font-size:14px;font-weight:800;margin-bottom:3px}.sub{font-size:12px;color:var(--muted);margin-bottom:9px;min-height:30px;line-height:1.35}
.card{background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:3px 3px 0 var(--ink);padding:16px 18px}
.k{font-size:11px;font-weight:800;letter-spacing:.07em;color:#475569;display:flex;justify-content:space-between}.k i{font-style:normal;color:#0F766E;letter-spacing:0}
.name{font-size:16px;font-weight:800;margin-top:5px}
.big{display:flex;align-items:baseline;gap:8px;margin-top:5px}.big b{font-size:44px;font-weight:800;line-height:1}.big span{font-size:15px;font-weight:700;color:var(--muted)}.big .d{margin-left:auto;font-size:12px;color:#E11D48;font-weight:800}
.goal{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-top:12px;padding-top:10px;border-top:1px solid #E2E8F0}.goal i{font-style:normal;color:#C2410C}
.bar{height:9px;border-radius:5px;background:#E2E8F0;margin-top:7px;overflow:hidden}.bar u{display:block;height:100%;width:40%;background:#2563EB}
.split{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;padding-top:10px;border-top:1px solid #E2E8F0}
.split div+div{border-left:1px solid #E2E8F0;padding-left:14px}
.split small{font-size:10px;font-weight:800;letter-spacing:.07em}.split .l small{color:#4338CA}.split .r small{color:#0F766E}
.split b{display:block;font-size:26px;font-weight:800;line-height:1.1}.split b em{font-style:normal;font-size:11px;color:var(--muted)}.split span{font-size:11px;color:var(--muted);font-weight:600}
.next{margin:14px 0 0;padding-top:12px;border-top:1px solid #E2E8F0}
.next p{font-size:12px;font-weight:700;color:var(--muted);line-height:1.5}.next p b{color:var(--ink);font-weight:800}
.go{margin-top:9px;display:flex;gap:10px;align-items:center}
.main{flex:1;background:#2563EB;color:#fff;border:2px solid var(--ink);border-radius:12px;padding:9px;text-align:center;font-weight:800;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.link{font-size:12px;font-weight:800;color:#4338CA;white-space:nowrap}
.trap{color:var(--ink)}.trap em{font-style:normal;color:#B45309;font-weight:800}
.ai{font-size:10px;color:#94A3B8;font-weight:700;margin-top:3px}
</style>
<div class="row" id="row"></div>
<script>
const head=`<div class="k"><span>KẾT QUẢ GẦN NHẤT · 06/11</span><i>Trình độ A2</i></div><div class="name">Test đồng bộ 21</div>
<div class="big"><b>400</b><span>/ 990</span><span class="d">▼ 535 so với bài trước</span></div>
<div class="goal"><span>Mục tiêu 990</span><i>còn 590 điểm</i></div><div class="bar"><u></u></div>
<div class="split"><div class="l"><small>LISTENING</small><b>200 <em>/495</em></b><span>97/100 câu</span></div><div class="r"><small>READING</small><b>200 <em>/495</em></b><span>100/100 câu</span></div></div>`;
const card=(n)=>`<div class="card">${head}<div class="next">${n}</div></div>`;
const link='<span class="link">Xem 7 Part →</span>';
const items=[
['Tầng 1 · Câu đến hạn ôn','Ưu tiên cao nhất. Dữ liệu: ngày ôn kế tiếp trong Sổ tay. Không cần AI.',card(`<p>Sổ tay có <b>5 câu</b> đến hạn ôn</p><div class="go"><div class="main">Ôn 5 câu ngay</div>${link}</div>`)],
['Tầng 2 · Part yếu nhất','Khi không có câu đến hạn. Dữ liệu: điểm từng Part người dùng đã nhập.',card(`<p>Mất nhiều điểm nhất: <b>Part 6</b> (sai 5 câu)</p><div class="go"><div class="main">Luyện Part 6</div>${link}</div>`)],
['Tầng 3 · Thêm "bẫy hay gặp"','Chỉ khi đề đã có kết quả Chẩn đoán AI được lưu. Không tự gọi AI khi mở trang.',card(`<p>Mất nhiều điểm nhất: <b>Part 6</b> (sai 5 câu)</p><p class="trap">Hay sai: <em>Ngữ pháp</em> · 4/5 câu đã chẩn đoán</p><div class="go"><div class="main">Luyện Part 6</div>${link}</div>`)],
['Chưa có điểm từng Part','Thay cho khoảng trống: một câu mời, không đoán Part nào yếu.',card(`<p>Ghi điểm từng Part để biết nên luyện gì tiếp.</p><div class="go" style="justify-content:flex-start">${link}</div>`)],
['Đã làm hết, không cần gì thêm','Không có câu đến hạn, không Part nào sai: chỉ còn link, không bịa việc.',card(`<div class="go" style="justify-content:flex-start;margin-top:0">${link}</div>`)]
];
document.getElementById('row').innerHTML=items.map(i=>`<div><div class="tag">${i[0]}</div><div class="sub">${i[1]}</div>${i[2]}</div>`).join('');
</script></html>
