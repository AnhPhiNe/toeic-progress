services:
  - type: web
    name: toeic-progress-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 64 --no-access-log
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: ENVIRONMENT
        value: staging
      - key: AI_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_REASONING_EFFORT
        value: medium
      - key: OPENAI_OCR_MODEL
        value: gpt-6-luna
      - key: OPENAI_OCR_EFFORT
        value: low
      - key: OPENAI_PAPER_OCR_MODEL
        value: gpt-6.1-terra
      - key: OPENAI_PAPER_OCR_EFFORT
        value: low
      - key: OPENAI_PAPER_RESULTS_MODEL
        value: gpt-6.1-terra
      - key: OPENAI_PAPER_RESULTS_EFFORT
        value: medium
      - key: OPENAI_PART7_MODEL
        value: gpt-6.1-terra
      - key: OPENAI_PART7_EFFORT
        value: medium
      - key: OPENAI_ADVICE_MODEL
        value: gpt-6.1-terra
      - key: OPENAI_ADVICE_REASONING_EFFORT
        value: medium
      - key: AI_PROVIDER_BUDGET_ENABLED
        value: "true"
      - key: AI_ACCESS_MANAGED
        value: "true"
      - key: API_LIMITS_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: AI_UNLIMITED_EMAILS
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: RATE_LIMIT_SECRET
        generateValue: true
      # Set after verifying with CLIENT_IP_DEBUG on staging (docs/DEPLOYMENT.md).
      - key: CLIENT_IP_HEADER
        sync: false
      - key: CLIENT_IP_DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: TURNSTILE_HOSTNAMES
        sync: false
