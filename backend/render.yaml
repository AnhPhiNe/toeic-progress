services:
  - type: web
    name: toeic-progress-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 32 --no-access-log
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: ENVIRONMENT
        value: staging
      - key: AI_ENABLED
        value: "false"
      - key: API_LIMITS_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: RATE_LIMIT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: TURNSTILE_HOSTNAMES
        sync: false
