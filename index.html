<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F97316'><path d='M12 2c1.1 0 2 .9 2 2 0 1.5-1 2.5-1 4 0 .6.4 1 1 1 2.2 0 4-1.8 4-4 0-.3 0-.6-.1-.9 2.5 1.5 4.1 4.3 4.1 7.4 0 4.7-3.8 8.5-8.5 8.5S5 16.2 5 11.5c0-3.3 1.9-6.3 4.8-7.7-.1.4-.1.7-.1 1.1 0 2.2 1.8 4 4 4 .6 0 1-.4 1-1 0-1.5-1-2.5-1-4 0-1.1.9-1.9 2-1.9z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EAEFF5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B111E" media="(prefers-color-scheme: dark)" />
    <title>TOEIC Progress 990 — Trạm Chỉ Huy Luyện Thi Công Nghệ Cao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Đặt theme TRƯỚC khi trình duyệt vẽ khung hình đầu tiên để tránh nháy sáng/tối.
      // Phải là script đồng bộ, đặt trong <head>, không được chuyển thành module hay defer.
      (function () {
        try {
          var saved = localStorage.getItem('toeic_theme_v1');
          var theme = saved === 'dark' || saved === 'light'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage bị chặn (chế độ riêng tư) - mặc định sáng */
        }
      })();
    </script>
  </head>
  <body class="font-['Plus_Jakarta_Sans',sans-serif] min-h-screen antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
